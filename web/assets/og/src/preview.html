<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VocaPhone OG preview</title>
<style>
:root {
  --paper: #f4f1e8;
  --ink: #14231c;
  --muted: #58625c;
  --body: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --mono: ui-monospace, "Ubuntu Mono", Consolas, monospace;
}

* { box-sizing: border-box; }

html,
body {
  margin: 0;
  color: var(--ink);
  background: var(--paper);
  font-family: var(--body);
}

main {
  display: grid;
  gap: 28px;
  justify-items: center;
  min-height: 100dvh;
  padding: 48px 24px 64px;
}

p {
  margin: 0;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

img {
  width: min(1200px, 100%);
  height: auto;
  border: 1px solid #c9c8bd;
  box-shadow: 0 22px 55px rgb(21 37 29 / 16%);
}
</style>
</head>
<body>
  <main>
    <p>Open Graph · 1200 × 630</p>
    <img
      src="../../og-image.png"
      width="1200"
      height="630"
      alt="VocaPhone: voice typing that stays yours. On-device first with an optional gateway."
    >
  </main>
</body>
</html>
