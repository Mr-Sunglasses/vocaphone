# Metadata intended for submission to fdroiddata.
#
# Copy this file to metadata/com.vocahq.vocaphone.yml in an fdroiddata merge
# request.
#
# Reproducible builds: F-Droid rebuilds assembleFdroidRelease from the tagged
# source on JDK 21 (matching .github/actions/setup-android), compares its
# unsigned rebuild with the upstream-signed vocaphone-fdroid.apk attached to
# the GitHub release, and then publishes that upstream-signed APK. The JDK 21
# alignment is defined in gradle/gradle-daemon-jvm.properties and in
# android/app/build.gradle.kts compileOptions; do not change the compiling JDK
# without reviewing this file first.
#
# The fragile half is the whisper/ggml code this flavour compiles from source:
# it is the only part of the APK that is not already byte-identical between two
# machines. android/app/src/main/cpp/whisper/CMakeLists.txt keeps it that way by
# rewriting __FILE__ prefixes, building ggml without OpenMP, and refusing to let
# ggml read a commit hash out of git. Changing any of those three, or the pinned
# ndk below, needs a two-path rebuild before it is tagged.
#
# Only the current version is listed. 0.1.0-beta.12 was published before those
# fixes, so its binary cannot be reproduced by anyone, including us, and
# 0.1.0-beta.13 never got an APK attached to its release at all.

