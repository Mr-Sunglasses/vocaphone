<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vocaphone gateway</title>
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;&#127908;&lt;/text&gt;&lt;/svg&gt;" />
</head>
<body>
  <div id="token-overlay" class="overlay hidden" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="token-title">
      <span class="modal-icon" aria-hidden="true">&#128274;</span>
      <h2 id="token-title">Connect to your gateway</h2>
      <p class="muted">
        Paste the gateway bearer token, or connect once and scan the pairing QR
        on Overview from your phone. On this host:
      </p>
      <code class="block">cat ~/.config/vocaphone/token</code>
      <input id="token-input" type="password" placeholder="Bearer token" autocomplete="off" />
      <p id="token-error" class="error hidden" role="alert"></p>
      <button id="token-save" type="button" class="primary">Connect securely</button>
    </div>
  </div>

  <header>
    <div class="brand">
      <span class="logo">&#127908;</span>
      <div>
        <h1>vocaphone</h1>
        <span class="muted">Private transcription gateway</span>
      </div>
    </div>
    <div id="engine-pill" class="pill unknown"
         hx-get="/ui/partials/engine-pill" hx-trigger="load, every 5s" hx-swap="outerHTML">
      connecting&hellip;
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Gateway sections">
    <button type="button" class="tab active" data-tab="overview" role="tab"
            aria-selected="true" aria-controls="panel"
            hx-get="/ui/partials/overview" hx-target="#panel" hx-swap="innerHTML">Overview</button>
    <button type="button" class="tab" data-tab="models" role="tab"
            aria-selected="false" aria-controls="panel"
            hx-get="/ui/partials/models" hx-target="#panel" hx-swap="innerHTML">Models</button>
    <button type="button" class="tab" data-tab="test" role="tab"
            aria-selected="false" aria-controls="panel"
            hx-get="/ui/partials/test" hx-target="#panel" hx-swap="innerHTML">Test</button>
    <button type="button" class="tab" data-tab="settings" role="tab"
            aria-selected="false" aria-controls="panel"
            hx-get="/ui/partials/settings" hx-target="#panel" hx-swap="innerHTML">Settings</button>
  </nav>

  <main>
    <div id="panel" role="tabpanel" aria-live="polite"
         hx-get="/ui/partials/overview" hx-trigger="load" hx-swap="innerHTML">
      <p class="muted loading">Loading&hellip;</p>
    </div>
  </main>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="/assets/htmx.min.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
