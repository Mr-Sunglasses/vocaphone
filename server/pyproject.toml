[project]
name = "localflow-gateway"
version = "0.2.0"
description = "Tailnet-only transcription gateway for the Local Flow iPhone keyboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
engines = [
  "faster-whisper>=1.2,<2",
  "moonshine-voice>=0.1,<0.2",
]

[project.scripts]
localflow-server = "app.cli:serve"
localflow-status = "app.cli:status"
localflow-cleanup = "app.cli:cleanup"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
