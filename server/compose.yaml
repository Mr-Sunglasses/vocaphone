name: vocaphone

services:
  gateway:
    image: ${VOCAPHONE_IMAGE:-vocaphone-gateway:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    network_mode: ${VOCAPHONE_NETWORK_MODE:-bridge}
    ports:
      - "${VOCAPHONE_PUBLISH_HOST:-127.0.0.1}:${VOCAPHONE_PUBLISH_PORT:-8765}:8765"
    environment:
      VOCAPHONE_TOKEN_FILE: /run/secrets/vocaphone_token
      VOCAPHONE_DEBUG: ${VOCAPHONE_DEBUG:-false}
    secrets:
      - vocaphone_token
    volumes:
      - vocaphone-data:/data

  gateway-native:
    profiles: ["native"]
    image: vocaphone-gateway:native
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GGML_NATIVE: "ON"
    restart: unless-stopped
    init: true
    network_mode: ${VOCAPHONE_NETWORK_MODE:-bridge}
    ports:
      - "${VOCAPHONE_PUBLISH_HOST:-127.0.0.1}:${VOCAPHONE_PUBLISH_PORT:-8765}:8765"
    environment:
      VOCAPHONE_TOKEN_FILE: /run/secrets/vocaphone_token
      VOCAPHONE_DEBUG: ${VOCAPHONE_DEBUG:-false}
    secrets: [vocaphone_token]
    volumes: [vocaphone-data:/data]

  gateway-cuda:
    profiles: ["cuda"]
    image: vocaphone-gateway:cuda
    build:
      context: .
      dockerfile: Dockerfile.cuda
    restart: unless-stopped
    init: true
    network_mode: ${VOCAPHONE_NETWORK_MODE:-bridge}
    ports:
      - "${VOCAPHONE_PUBLISH_HOST:-127.0.0.1}:${VOCAPHONE_PUBLISH_PORT:-8765}:8765"
    environment:
      VOCAPHONE_TOKEN_FILE: /run/secrets/vocaphone_token
      VOCAPHONE_DEBUG: ${VOCAPHONE_DEBUG:-false}
      NVIDIA_VISIBLE_DEVICES: all
    gpus: all
    secrets: [vocaphone_token]
    volumes: [vocaphone-data:/data]

  gateway-vulkan:
    profiles: ["vulkan"]
    image: vocaphone-gateway:vulkan
    build:
      context: .
      dockerfile: Dockerfile.vulkan
    restart: unless-stopped
    init: true
    network_mode: ${VOCAPHONE_NETWORK_MODE:-bridge}
    ports:
      - "${VOCAPHONE_PUBLISH_HOST:-127.0.0.1}:${VOCAPHONE_PUBLISH_PORT:-8765}:8765"
    environment:
      VOCAPHONE_TOKEN_FILE: /run/secrets/vocaphone_token
      VOCAPHONE_DEBUG: ${VOCAPHONE_DEBUG:-false}
    devices:
      - /dev/dri:/dev/dri
    secrets: [vocaphone_token]
    volumes: [vocaphone-data:/data]

secrets:
  vocaphone_token:
    environment: VOCAPHONE_TOKEN

volumes:
  vocaphone-data:
