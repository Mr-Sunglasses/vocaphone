name: Feature request
description: An idea for the Android or iOS app.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        VocaPhone stays on-device by default and does not need an account.
        Leave out tokens, recordings, transcripts, and private hostnames.
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Android app
        - iOS app
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is awkward or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest change
      description: The smallest change that would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other options (optional)
      description: Anything you already tried, or a different approach you considered.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I looked for an existing issue
          required: true
