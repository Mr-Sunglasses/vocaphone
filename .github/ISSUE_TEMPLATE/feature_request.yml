name: Feature request
description: Suggest a focused improvement that fits vocaphone's privacy-first design.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please keep proposals aligned with self-hosted transcription, no cloud STT,
        and the documented iOS/Android platform constraints. Do not include tokens,
        recordings, transcripts, or private hostnames.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - iOS containing app
        - Custom keyboard
        - Android floating bubble
        - Native or Docker gateway
        - Engine adapters / model catalog
        - Documentation or contributor experience
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve for a self-hosted dictation user?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest change that would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, or why existing options fall short.
  - type: checkboxes
    id: constraints
    attributes:
      label: Design constraints
      options:
        - label: This does not require cloud speech-to-text or a mandatory account
        - label: This does not weaken bearer auth, upload limits, retention, or loopback/Tailscale exposure controls
        - label: I have checked existing issues and docs for a similar request
