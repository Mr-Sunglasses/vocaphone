name: Bug report
description: Something broken in the Android or iOS app.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Leave out recordings, transcripts, tokens, and private hostnames.
        Security issues go through SECURITY.md or a private advisory, not this form.
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Android app
        - iOS app
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Then ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Phone and version
      description: Phone model, OS version, and the VocaPhone app version or release tag.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs (optional)
      description: Strip tokens, transcripts, recordings, and hostnames first.
      render: shell
