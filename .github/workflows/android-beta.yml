name: Android beta APK

# Pushing a tag like v0.1.0-beta.1 builds the debug APK and publishes it both
# as a workflow artifact and as a prerelease on GitHub Releases. Debug builds
# are signed with the debug keystore, so the APK installs directly on any
# device running Android 13 (API 33) or newer without extra signing setup.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-beta*'

permissions:
  contents: write

concurrency:
  group: android-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          # Matches the JDK bundled with Android Studio, which is what the build
          # has been verified against locally.
          java-version: '25'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: localflow-beta-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish beta GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Local Flow Android $GITHUB_REF_NAME" \
            --prerelease \
            --notes "Universal debug APK covering every ABI (arm64-v8a, armeabi-v7a, x86_64) and all Android 13+ devices. Install with \`adb install app-debug.apk\` or open the APK on the device."
