name: Android beta APK

# Pushing a tag like v0.1.0-beta.1 builds the release APK signed with the
# Local Flow keystore and publishes it both as a workflow artifact and as a
# prerelease on GitHub Releases. A release-signed APK installs cleanly on any
# device running Android 13 (API 33) or newer without Play Protect flagging the
# well-known debug key.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-beta*'

permissions:
  contents: write

concurrency:
  group: android-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          # Matches the JDK bundled with Android Studio, which is what the build
          # has been verified against locally.
          java-version: '25'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/local-flow-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
          ./gradlew assembleRelease
        working-directory: android
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-flow-apk
          path: android/app/build/outputs/apk/release/local-flow-release.apk
          if-no-files-found: error
      - name: Publish beta GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/local-flow-release.apk local-flow.apk
          gh release create "$GITHUB_REF_NAME" \
            local-flow.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Local Flow Android $GITHUB_REF_NAME" \
            --prerelease \
            --notes "Release-signed APK covering every ABI (arm64-v8a, armeabi-v7a, x86_64) and all Android 13+ devices. Install with \`adb install local-flow.apk\` or open the APK on the device."
