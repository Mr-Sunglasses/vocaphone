name: Android beta APK

# Pushing a tag like v0.1.0-beta.1 builds the release APK signed with the
# Local Flow keystore and publishes it both as a workflow artifact and as a
# prerelease on GitHub Releases. A release-signed APK installs cleanly on any
# device running Android 13 (API 33) or newer without Play Protect flagging the
# well-known debug key.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-beta*'

permissions:
  contents: write

concurrency:
  group: android-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The release notes step walks back to the previous beta tag, which
          # needs the tags and the history connecting them. Only the commits
          # are needed, so skip fetching every blob in that history.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup-android
        with:
          # A cache entry saved from a tag ref is scoped to that tag and can
          # never be restored again, so this build reads main's and saves none.
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/local-flow-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Passed through the environment rather than interpolated into the
          # script, so the keystore never becomes part of the command line.
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          ./gradlew assembleRelease
        working-directory: android
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-flow-apk
          path: android/app/build/outputs/apk/release/local-flow-release.apk
          if-no-files-found: error
          # The release below is the durable copy. This one only covers the
          # window before it is published, so it does not need 90 days of
          # storage, and an APK is already a compressed archive.
          retention-days: 7
          compression-level: 0
      - name: Publish beta GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/local-flow-release.apk local-flow.apk

          # --generate-notes lists the pull requests merged since the previous
          # beta. It will choose that starting point on its own, but naming the
          # tag explicitly keeps the range right for a tag cut from anywhere
          # other than the tip of main. An empty result is the first beta ever,
          # where letting it pick means "everything", which is correct.
          previous_tag="$(git describe --tags --abbrev=0 --match 'v*-beta*' "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          notes_range=()
          if [ -n "$previous_tag" ]; then
            notes_range=(--notes-start-tag "$previous_tag")
          fi

          # --notes is prepended to the generated list, so the install
          # instructions stay at the top where a beta tester looks first.
          gh release create "$GITHUB_REF_NAME" \
            local-flow.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Local Flow Android $GITHUB_REF_NAME" \
            --prerelease \
            --generate-notes \
            "${notes_range[@]}" \
            --notes "Release-signed APK covering every ABI (arm64-v8a, armeabi-v7a, x86_64) and all Android 13+ devices. Install with \`adb install local-flow.apk\` or open the APK on the device."
