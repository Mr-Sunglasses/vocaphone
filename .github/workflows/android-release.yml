name: Android release

# Pushing a version tag builds the signed full and fdroid release APKs plus the
# full-flavor AAB (Play upload candidate), then publishes them as a workflow
# artifact and a GitHub Release. Checksums and the signing certificate
# fingerprint are attached so testers can verify what they install. After the
# GitHub Release is published, the full AAB is uploaded to Google Play Internal
# testing when PLAY_SERVICE_ACCOUNT_JSON is set. That step is skipped if the
# secret is empty. fdroid artifacts and production are never uploaded: every
# track past Internal is promoted by hand in Console.
#
# Both tag shapes run the same build. Semver's own rule decides which is which:
# a hyphen means a prerelease, so v0.1.0-beta.20 is published as a prerelease
# and v0.1.0 is published as the latest release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # steps.if cannot read secrets. This is true only when the Play JSON
      # secret is non-empty, so the upload step can skip without it.
      PLAY_SERVICE_ACCOUNT_JSON_SET: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # The release notes step walks back to the previous release tag, which
          # needs the tags and the history connecting them. Only the commits
          # are needed, so skip fetching every blob in that history.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup-android
        with:
          # A cache entry saved from a tag ref is scoped to that tag and can
          # never be restored again, so this build reads main's and saves none.
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build signed release APKs and Play AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/vocaphone-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Passed through the environment rather than interpolated into the
          # script, so the keystore never becomes part of the command line.
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          # Play gets the full-flavor AAB only. fdroid is APK-only for F-Droid
          # rebuild verification; do not bundle that flavour for store upload.
          ./gradlew assembleFullRelease assembleFdroidRelease bundleFullRelease \
            testFullDebugUnitTest lintFullRelease
        working-directory: android
      - name: Verify signature and prepare release assets
        env:
          # Public certificate fingerprint, not a signing secret. Pinning it
          # prevents a valid APK signed by the wrong CI key from being released.
          EXPECTED_CERT_SHA256: e6131446f8afeff13516f78036db9ea26aaa16e01b39f37182bf262ccd1d45b0
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp android/app/build/outputs/apk/full/release/vocaphone-fullRelease.apk \
            release-assets/vocaphone.apk
          # The fdroid flavour drops the prebuilt sherpa-onnx and ONNX Runtime
          # libraries, so every byte it ships is built from source. F-Droid
          # builds this flavour; publishing it gives them a binary to verify
          # their own rebuild against, which is what enables reproducible
          # builds on their side.
          cp android/app/build/outputs/apk/fdroid/release/vocaphone-fdroidRelease.apk \
            release-assets/vocaphone-fdroid.apk

          # AGP names the bundle from the module (app) plus flavor/build type.
          # Glob rather than hard-coding the filename so a future archivesBaseName
          # change does not silently publish a stale path.
          shopt -s nullglob
          aab_candidates=(android/app/build/outputs/bundle/fullRelease/*.aab)
          shopt -u nullglob
          if [ "${#aab_candidates[@]}" -ne 1 ]; then
            echo "Expected exactly one fullRelease AAB, found ${#aab_candidates[@]}" >&2
            printf '%s\n' "${aab_candidates[@]}" >&2
            exit 1
          fi
          cp "${aab_candidates[0]}" release-assets/vocaphone.aab

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print \
            | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "apksigner was not found under ANDROID_HOME" >&2
            exit 1
          fi
          aapt="$(dirname "$apksigner")/aapt"
          if [ ! -x "$aapt" ]; then
            echo "aapt was not found next to apksigner" >&2
            exit 1
          fi

          # Both flavours are published, so both get the same identity and
          # signature checks rather than the second one being trusted implicitly.
          for apk in release-assets/vocaphone.apk release-assets/vocaphone-fdroid.apk; do
            package_line="$("$aapt" dump badging "$apk" | sed -n '1p')"
            package_name="$(printf '%s\n' "$package_line" \
              | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            version_name="$(printf '%s\n' "$package_line" \
              | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")"
            if [ "$package_name" != "com.vocahq.vocaphone" ]; then
              echo "Unexpected package in $apk: $package_name" >&2
              exit 1
            fi
            if [ "v$version_name" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match $apk version $version_name" >&2
              exit 1
            fi

            verification="$("$apksigner" verify --verbose --print-certs "$apk")"
            printf '%s\n' "$verification"
            certificate_sha256="$(printf '%s\n' "$verification" \
              | sed -n 's/.*certificate SHA-256 digest: //p')"
            if [ "$certificate_sha256" != "$EXPECTED_CERT_SHA256" ]; then
              echo "Unexpected signing certificate in $apk: $certificate_sha256" >&2
              exit 1
            fi
          done

          # Package name and versionName are checked on vocaphone.apk above
          # (same fullRelease build). aapt dump badging does not apply to
          # bundles. Verify the AAB upload-key fingerprint with keytool, which
          # reads the JAR signing block AABs use; apksigner is APK-oriented.
          aab_certificate_sha256="$(keytool -printcert -jarfile release-assets/vocaphone.aab \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n 1 \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"
          printf 'vocaphone.aab signing certificate SHA-256: %s\n' "$aab_certificate_sha256"
          if [ -z "$aab_certificate_sha256" ]; then
            echo "Could not read signing certificate from vocaphone.aab" >&2
            exit 1
          fi
          if [ "$aab_certificate_sha256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Unexpected signing certificate in vocaphone.aab: $aab_certificate_sha256" >&2
            exit 1
          fi

          # APKs and the full AAB share package, version and signing key, which
          # the checks above enforced, so one fingerprint file covers them all.
          formatted_certificate="$(printf '%s' "$EXPECTED_CERT_SHA256" \
            | sed 's/../&:/g; s/:$//' | tr '[:lower:]' '[:upper:]')"
          printf 'Package: %s\nVersion: %s\nSigning certificate SHA-256: %s\n' \
            "com.vocahq.vocaphone" "${GITHUB_REF_NAME#v}" "$formatted_certificate" \
            > release-assets/SIGNING-CERTIFICATE-SHA256.txt
          (cd release-assets \
            && sha256sum vocaphone.apk vocaphone-fdroid.apk vocaphone.aab \
              > SHA256SUMS.txt)
      - name: Upload release files as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vocaphone-release-assets
          path: release-assets/
          if-no-files-found: error
          # The release below is the durable copy. This one only covers the
          # window before it is published, so it does not need 90 days of
          # storage, and an APK is already a compressed archive.
          retention-days: 7
          compression-level: 0
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Semver: anything after a hyphen is a prerelease identifier. The tag
          # patterns above admit only these two shapes, so the absence of one
          # is the presence of the other.
          case "$GITHUB_REF_NAME" in
            *-*) release_kind=(--prerelease) ;;
            *) release_kind=(--latest) ;;
          esac

          # --generate-notes lists the pull requests merged since the previous
          # release of the same kind. It will choose a starting point on its
          # own, but naming the tag explicitly keeps the range right for a tag
          # cut from anywhere other than the tip of main.
          #
          # A stable tag looks back to the previous stable one, so 0.2.0 covers
          # everything since 0.1.0 rather than only what landed after the last
          # beta of the 0.2.0 series. An empty result is the first release of
          # that kind, where letting it pick means "everything" — which is what
          # the first stable release should say.
          case "$GITHUB_REF_NAME" in
            *-*) match=(--match 'v*-*') ;;
            *) match=(--match 'v*' --exclude 'v*-*') ;;
          esac
          previous_tag="$(git describe --tags --abbrev=0 "${match[@]}" "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          notes_range=()
          if [ -n "$previous_tag" ]; then
            notes_range=(--notes-start-tag "$previous_tag")
          fi

          # --notes is prepended to the generated list, so the install
          # instructions stay at the top where someone installing looks first.
          gh release create "$GITHUB_REF_NAME" \
            release-assets/vocaphone.apk \
            release-assets/vocaphone-fdroid.apk \
            release-assets/vocaphone.aab \
            release-assets/SHA256SUMS.txt \
            release-assets/SIGNING-CERTIFICATE-SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "vocaphone Android $GITHUB_REF_NAME" \
            "${release_kind[@]}" \
            --generate-notes \
            "${notes_range[@]}" \
            --notes "Release-signed APK covering every ABI (arm64-v8a, armeabi-v7a, x86_64) and all Android 13+ devices. Install with \`adb install vocaphone.apk\` or open the APK on the device. \`vocaphone.aab\` is the same full-flavor build as an Android App Bundle. This workflow uploads it to Google Play Internal testing when PLAY_SERVICE_ACCOUNT_JSON is set. SHA-256 checksum and signing-certificate fingerprint files are attached for verification. Android may still scan or restrict APKs installed outside an app store. \`vocaphone-fdroid.apk\` is the same release built without the prebuilt sherpa-onnx and ONNX Runtime libraries, published so F-Droid can verify its own rebuild against it; install \`vocaphone.apk\` unless you specifically want that variant."
      # After the GitHub Release so testers still get APKs if Play fails.
      # The action defaults to the production track, so tracks must be
      # internal. If that API name is missing, qa is the only other name
      # to try. Full-flavor AAB only; never fdroid, never production.
      #
      # A stable tag lands on Internal too. Play wants a closed test before
      # production, and that promotion is a decision with a rollout percentage
      # and a staged-release halt behind it, so it stays a Console action
      # rather than a consequence of pushing a tag.
      - name: Upload vocaphone.aab to Play Internal testing
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON_SET == 'true' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.vocahq.vocaphone
          releaseFiles: release-assets/vocaphone.aab
          tracks: internal
          status: completed
          releaseName: ${{ github.ref_name }}
