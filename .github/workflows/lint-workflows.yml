name: Lint workflows

# A typo in a workflow is only discovered when it runs, and by then it has
# already claimed a runner — a macOS one at ten times the rate, in the worst
# case. Twenty seconds on Linux catches it first.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-workflows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          tar --extract --gzip --file actionlint.tar.gz actionlint
          # The runner image ships shellcheck, so run: blocks get linted as
          # shell as well as YAML.
          ./actionlint -color
      - name: Test CI scope and required gate
        run: python3 -m unittest discover -s tools -p 'test_ci_scope.py'
      - name: Test native dependency inventory
        run: python3 -m unittest discover -s tools -p 'test_complete_android_sbom.py'
      - name: Test PR signing isolation and action pins
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 -m unittest discover -s tools -p 'test_workflow_security.py'
