name: CodeQL (web)

# JavaScript/TypeScript needs no build step to analyze, so this runs on every
# pull request like the other quality gates. See codeql-native.yml for why
# Kotlin and Swift analysis runs on a different schedule.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '!web/**.md'
      - '.github/workflows/codeql-web.yml'
  workflow_call:
  schedule:
    # Catches newly published CodeQL query packs even in a week nobody
    # touches web/.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          source-root: web
          build-mode: none

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
