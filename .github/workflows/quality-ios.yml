name: Quality (iOS)

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      # EmojiCatalogTests asserts against the real shared catalog, so a
      # change to it has to run this suite. Worth the macOS minutes: it is
      # the only check that the file both keyboards ship still parses.
      - 'assets/keyboard/**'
      # Prose next to the code it documents cannot break the build, and macOS
      # minutes bill at ten times the Linux rate.
      - '!ios/**.md'
      - '.github/actions/report-size/**'
      - '.github/workflows/quality-ios.yml'
  pull_request:
    branches: [main]
    # A draft pull request is filtered out below; listing ready_for_review makes
    # the checks start the moment it stops being a draft.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'ios/**'
      # EmojiCatalogTests asserts against the real shared catalog, so a
      # change to it has to run this suite. Worth the macOS minutes: it is
      # the only check that the file both keyboards ship still parses.
      - 'assets/keyboard/**'
      - '!ios/**.md'
      - '.github/actions/report-size/**'
      - '.github/workflows/quality-ios.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Lets report-size post/update its size comment on same-repo pull requests.
  # Fork pull requests get a read-only token regardless, which the action
  # already tolerates.
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded pull request push is wasted minutes, but a run on main is the
  # record for a merged commit, so let that one finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Homebrew otherwise refreshes its whole formula index before installing, and
  # cleans up afterwards, on a runner that is thrown away either way.
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  HOMEBREW_NO_ENV_HINTS: '1'

jobs:
  ios:
    # Work in progress re-runs the full build on every push. The checks that
    # matter run when the author marks the pull request ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - run: brew install xcodegen
      - name: Fail if the checked-in Xcode project is stale
        working-directory: ios
        run: |
          xcodegen generate --spec project.yml
          git diff --exit-code -- VocaPhone.xcodeproj

      # Seconds on the runner, and the only thing standing between the preview
      # harness and a shipping build. Runs before the build so a leak fails
      # fast rather than after twenty minutes of xcodebuild.
      - name: Fail if preview code is reachable from a release build
        working-directory: ios
        run: python3 tools/check-preview-isolation.py

      - name: Pick an iOS simulator
        id: simulator
        run: |
          set -euo pipefail
          # macos-15 images sometimes list no pre-created devices for
          # -showdestinations until simctl has materialized one. Prefer an
          # available iPhone simulator; create one if there is none.
          udid=$(
            xcrun simctl list devices available \
              | sed -n 's/.*iPhone[^(]*(\([A-F0-9-]*\)).*/\1/p' \
              | head -1
          )
          if [ -z "${udid}" ]; then
            runtime=$(
              xcrun simctl list runtimes available \
                | sed -n 's/.* - \(com\.apple\.CoreSimulator\.SimRuntime\.iOS[^ ]*\).*/\1/p' \
                | tail -1
            )
            device_type=$(
              xcrun simctl list devicetypes \
                | sed -n 's/.*(\(com\.apple\.CoreSimulator\.SimDeviceType\.iPhone-[^)]*\)).*/\1/p' \
                | tail -1
            )
            if [ -z "${runtime}" ] || [ -z "${device_type}" ]; then
              echo "No iOS simulator runtime/device type available" >&2
              xcrun simctl list runtimes || true
              xcrun simctl list devicetypes || true
              exit 1
            fi
            echo "Creating simulator: type=${device_type} runtime=${runtime}"
            udid=$(xcrun simctl create "VocaPhone-CI-iPhone" "${device_type}" "${runtime}")
          fi
          echo "Using simulator ${udid}"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"

      - name: Build and run iOS unit tests
        working-directory: ios
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
          RESULT_BUNDLE: ${{ runner.temp }}/VocaPhone.xcresult
        run: |
          set -euo pipefail

          # First boot spends over a minute in data migration, and the build
          # needs no device at all. Boot in the background so that minute
          # overlaps compilation instead of running before it.
          xcrun simctl bootstatus "${UDID}" -b &
          boot=$!

          # Shared flags. Index-while-building only feeds Xcode's editor, and
          # there are no Swift packages to resolve, so both are pure overhead
          # here.
          common=(
            -project VocaPhone.xcodeproj
            -scheme VocaPhone
            -sdk iphonesimulator
            -destination "platform=iOS Simulator,id=${UDID}"
            -derivedDataPath "${DERIVED_DATA}"
            -disableAutomaticPackageResolution
            CODE_SIGNING_ALLOWED=NO
            COMPILER_INDEX_STORE_ENABLE=NO
          )

          # -quiet drops roughly 1500 lines of per-file compile commands while
          # still printing warnings and errors. The test run below keeps its
          # full output, which is short and carries the failed expectation.
          xcodebuild "${common[@]}" -quiet build-for-testing

          # Fails the step if the device never came up, which is a clearer
          # signal than xcodebuild timing out against a half-booted simulator.
          wait "${boot}"

          xcodebuild "${common[@]}" \
            -resultBundlePath "${RESULT_BUNDLE}" \
            test-without-building

      - name: Upload the test result bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/VocaPhone.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Measure app bundle size
        id: size
        env:
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: |
          set -euo pipefail
          # The app target is named VocaPhoneApp (see ios/project.yml), and
          # nothing overrides PRODUCT_NAME, so the built bundle is
          # VocaPhoneApp.app - not VocaPhone.app, which is only the scheme
          # and .xcodeproj name.
          app=$(find "$DERIVED_DATA/Build/Products" -maxdepth 2 -name 'VocaPhoneApp.app' | head -1)
          if [ -z "$app" ]; then
            echo "No VocaPhoneApp.app found under $DERIVED_DATA/Build/Products" >&2
            exit 1
          fi
          bytes=$(find "$app" -type f -exec stat -f%z {} + | awk '{sum += $1} END {print sum}')
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"

      # This is the unsigned Debug-simulator build the tests above already
      # produced, not the signed Release device build TestFlight ships — it
      # moves with the code the same way a Release build would, at zero extra
      # xcodebuild cost, which is what a trend comparison needs.
      - name: Report app bundle size vs. main
        uses: ./.github/actions/report-size
        with:
          component: ios
          label: iOS app bundle (Debug, simulator)
          bytes: ${{ steps.size.outputs.bytes }}
