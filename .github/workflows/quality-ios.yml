name: Quality (iOS)

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      # EmojiCatalogTests asserts against the real shared catalog, so a
      # change to it has to run this suite. Worth the macOS minutes: it is
      # the only check that the file both keyboards ship still parses.
      - 'assets/keyboard/**'
      # Prose next to the code it documents cannot break the build, and macOS
      # minutes bill at ten times the Linux rate.
      - '!ios/**.md'
      - '.github/actions/report-size/**'
      - '.github/workflows/quality-ios.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  # Lets report-size post/update its size comment on same-repo pull requests.
  # Fork pull requests get a read-only token regardless, which the action
  # already tolerates.
  pull-requests: write

concurrency:
  group: quality-ios-${{ github.workflow }}-${{ github.ref }}
  # A superseded pull request push is wasted minutes, but a run on main is the
  # record for a merged commit, so let that one finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Homebrew otherwise refreshes its whole formula index before installing, and
  # cleans up afterwards, on a runner that is thrown away either way.
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  HOMEBREW_NO_ENV_HINTS: '1'

jobs:
  ios:
    # Work in progress re-runs the full build on every push. The checks that
    # matter run when the author marks the pull request ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-15
    # Twenty for the build and unit tests, and room for the model tests when a
    # change calls for them.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          # `macos-15` still defaults to Xcode 16.4 / iOS 18.5, and this job
          # otherwise builds the keyboard against an SDK the project does not
          # target: `project.yml` asks for Xcode 26 and the release workflow
          # already selects it here. Anything guarded by `#available(iOS 26, *)`
          # still fails to *compile* on the older SDK, because a runtime check
          # cannot conjure a symbol the SDK has never heard of.
          app="$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$app"
          xcodebuild -version

      - run: brew install xcodegen
      - name: Fail if the checked-in Xcode project is stale
        working-directory: ios
        run: |
          xcodegen generate --spec project.yml
          git diff --exit-code -- VocaPhone.xcodeproj

      - name: Check native model catalogs and pins
        run: python3 tools/model-pins/check_catalogs.py

      # Seconds on the runner, and the only thing standing between the preview
      # harness and a shipping build. Runs before the build so a leak fails
      # fast rather than after twenty minutes of xcodebuild.
      - name: Fail if preview code is reachable from a release build
        working-directory: ios
        run: python3 tools/check-preview-isolation.py

      - name: Pick an iOS simulator
        id: simulator
        run: |
          set -euo pipefail
          # macos-15 images sometimes list no pre-created devices for
          # -showdestinations until simctl has materialized one. Prefer an
          # available iPhone simulator; create one if there is none.
          udid=$(
            xcrun simctl list devices available \
              | sed -n 's/.*iPhone[^(]*(\([A-F0-9-]*\)).*/\1/p' \
              | head -1
          )
          if [ -z "${udid}" ]; then
            runtime=$(
              xcrun simctl list runtimes available \
                | sed -n 's/.* - \(com\.apple\.CoreSimulator\.SimRuntime\.iOS[^ ]*\).*/\1/p' \
                | tail -1
            )
            device_type=$(
              xcrun simctl list devicetypes \
                | sed -n 's/.*(\(com\.apple\.CoreSimulator\.SimDeviceType\.iPhone-[^)]*\)).*/\1/p' \
                | tail -1
            )
            if [ -z "${runtime}" ] || [ -z "${device_type}" ]; then
              echo "No iOS simulator runtime/device type available" >&2
              xcrun simctl list runtimes || true
              xcrun simctl list devicetypes || true
              exit 1
            fi
            echo "Creating simulator: type=${device_type} runtime=${runtime}"
            udid=$(xcrun simctl create "VocaPhone-CI-iPhone" "${device_type}" "${runtime}")
          fi
          echo "Using simulator ${udid}"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"

      - name: Build and run iOS unit tests
        working-directory: ios
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
          RESULT_BUNDLE: ${{ runner.temp }}/VocaPhone.xcresult
        run: |
          set -euo pipefail

          # First boot spends over a minute in data migration, and the build
          # needs no device at all. Boot in the background so that minute
          # overlaps compilation instead of running before it.
          xcrun simctl bootstatus "${UDID}" -b &
          boot=$!

          # Shared flags. Index-while-building only feeds Xcode's editor.
          # Package versions are pinned in Package.resolved.
          common=(
            -project VocaPhone.xcodeproj
            -scheme VocaPhone
            -sdk iphonesimulator
            -destination "platform=iOS Simulator,id=${UDID}"
            -derivedDataPath "${DERIVED_DATA}"
            -disableAutomaticPackageResolution
            CODE_SIGNING_ALLOWED=NO
            COMPILER_INDEX_STORE_ENABLE=NO
          )

          # -quiet drops roughly 1500 lines of per-file compile commands while
          # still printing warnings and errors. The test run below keeps its
          # full output, which is short and carries the failed expectation.
          xcodebuild "${common[@]}" -quiet build-for-testing

          # Fails the step if the device never came up, which is a clearer
          # signal than xcodebuild timing out against a half-booted simulator.
          wait "${boot}"

          xcodebuild "${common[@]}" \
            -resultBundlePath "${RESULT_BUNDLE}" \
            test-without-building

      # The unit tests above stub WhisperKit out, which is how an upgrade that
      # returned empty windows passed them. This decodes synthesized speech
      # with the real pinned model, so it runs when a pull request touches
      # anything between the recording and the typed text, or WhisperKit's
      # version, and on a manual run. It reuses the build above.
      #
      # The filter lists what the pipeline reads: conditioning, the decode
      # options and quality, the catalog, and everything
      # DictatedTranscript.finished calls. KeyboardPreferences is left out
      # although it declares WritingStyle, because nearly every keyboard change
      # touches it and a style change is covered by the unit tests.
      - name: Decide whether to run the on-device model tests
        id: model-scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${EVENT}" != "pull_request" ] || [ -z "${BASE_SHA}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          changed=$(git diff --name-only "${BASE_SHA}" HEAD)
          pattern='^(ios/VocaPhone\.xcodeproj/project\.xcworkspace/xcshareddata/swiftpm/Package\.resolved|ios/project\.yml|ios/VocaPhoneApp/Models/|ios/VocaPhoneShared/(SpeechAudioConditioning|DictatedTranscript|Transcript[A-Za-z]*|CustomVocabulary|Spoken[A-Za-z]*|SentencePunctuation|ProtectedSpans|Snippet[A-Za-z]*|EmojiTable|LocalModelCatalog|ModelLanguageSupport|Sherpa[A-Za-z]*)\.swift|ios/VocaPhoneTests/(LocalModel|SherpaModel)EndToEndTests\.swift|tools/model-e2e/|\.github/workflows/quality-ios\.yml)'
          if printf '%s\n' "${changed}" | grep -Eq "${pattern}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache the pinned test model
        if: steps.model-scope.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/build/model-e2e
          key: model-e2e-${{ hashFiles('ios/VocaPhoneApp/Models/local_model_pins.json', 'ios/VocaPhoneApp/Models/sherpa_model_pins.json') }}

      - name: Run the on-device model tests
        if: steps.model-scope.outputs.run == 'true'
        working-directory: ios
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
          RESULT_BUNDLE: ${{ runner.temp }}/VocaPhoneModel.xcresult
        run: |
          set -euo pipefail
          dir="${PWD}/build/model-e2e"
          python3 ../tools/model-e2e/fetch_whisper.py openai_whisper-small_216MB "${dir}"
          python3 ../tools/model-e2e/fetch_sherpa.py parakeet-tdt-ctc-110m-en "${dir}"
          python3 ../tools/model-e2e/make_scenarios.py "${dir}/scenarios"
          # xcodebuild hands TEST_RUNNER_-prefixed variables to the tests.
          TEST_RUNNER_VOCA_MODEL_E2E_DIR="${dir}" \
          TEST_RUNNER_VOCA_MODEL_E2E_MODEL=openai_whisper-small_216MB \
          xcodebuild \
            -project VocaPhone.xcodeproj \
            -scheme VocaPhone \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -derivedDataPath "${DERIVED_DATA}" \
            -disableAutomaticPackageResolution \
            -resultBundlePath "${RESULT_BUNDLE}" \
            -only-testing:VocaPhoneTests/LocalModelEndToEndTests \
            -only-testing:VocaPhoneTests/SherpaModelEndToEndTests \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test-without-building

          # A suite whose input did not arrive is skipped, not failed, and a
          # skipped suite passes. So require that tests ran and none skipped.
          summary=$(xcrun xcresulttool get test-results summary --path "${RESULT_BUNDLE}" --compact)
          echo "${summary}"
          python3 -c 'import json, sys
          s = json.loads(sys.argv[1])
          ran, skipped = s.get("passedTests", 0) + s.get("failedTests", 0), s.get("skippedTests", 0)
          sys.exit(0 if ran > 0 and skipped == 0 else f"model tests ran {ran}, skipped {skipped}")' "${summary}"

      - name: Upload the test result bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/VocaPhone.xcresult
            ${{ runner.temp }}/VocaPhoneModel.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Measure app bundle size
        id: size
        env:
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: |
          set -euo pipefail
          # The app target is named VocaPhoneApp (see ios/project.yml), and
          # nothing overrides PRODUCT_NAME, so the built bundle is
          # VocaPhoneApp.app - not VocaPhone.app, which is only the scheme
          # and .xcodeproj name.
          app=$(find "$DERIVED_DATA/Build/Products" -maxdepth 2 -name 'VocaPhoneApp.app' | head -1)
          if [ -z "$app" ]; then
            echo "No VocaPhoneApp.app found under $DERIVED_DATA/Build/Products" >&2
            exit 1
          fi
          bytes=$(find "$app" -type f -exec stat -f%z {} + | awk '{sum += $1} END {print sum}')
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"

      # This is the unsigned Debug-simulator build the tests above already
      # produced, not the signed Release device build TestFlight ships — it
      # moves with the code the same way a Release build would, at zero extra
      # xcodebuild cost, which is what a trend comparison needs.
      - name: Report app bundle size vs. main
        uses: ./.github/actions/report-size
        with:
          component: ios
          label: iOS app bundle (Debug, simulator)
          bytes: ${{ steps.size.outputs.bytes }}
