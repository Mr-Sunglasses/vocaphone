name: Quality (shared assets)

# The keyboard assets at the repository root are read by both platforms, so
# they belong to neither platform's workflow. This one checks that the
# generated ones still match their generator: the emoji catalog and the
# suggestion table are thousands of lines nobody reviews by eye, and a hand
# edit to either is silently undone by the next person to run --write.
#
# Nothing here needs the network. tools/unicode/ carries the pinned Unicode and
# CLDR sources, which is what makes this check mean the same thing on every run
# and lets F-Droid rebuild the catalog from this tree alone.

on:
  push:
    branches: [main]
    paths:
      - 'assets/keyboard/**'
      - 'tools/**'
      - 'android/app/src/main/java/com/vocahq/vocaphone/local/SherpaModelCatalog.kt'
      - 'ios/VocaPhoneShared/LocalModelCatalog.swift'
      - 'ios/VocaPhoneApp/Models/*model_pins.json'
      - '.github/workflows/quality-assets.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-assets-${{ github.workflow }}-${{ github.ref }}
  # A superseded pull request push is wasted minutes, but a run on main is the
  # record for a merged commit, so let that one finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  assets:
    # Work in progress re-runs the checks on every push. The checks that
    # matter run when the author marks the pull request ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail if the emoji catalog or suggestions do not match the generator
        run: python3 tools/generate-emoji-catalog.py --check
      - name: Check native model catalogs and pins
        run: python3 tools/model-pins/check_catalogs.py
      # The model tests run in the iOS and Android jobs, which a change confined
      # to tools/model-e2e/ does not reach. This checks the tooling offline:
      # every pin resolves to a Hugging Face URL and a digest, and a scenario
      # WAV reads back unchanged.
      - name: Check the model-test tooling
        run: python3 tools/model-e2e/selftest.py
      - name: Check generated brand assets
        run: python3 assets/generate.py --check
