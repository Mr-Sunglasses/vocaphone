name: CodeQL (native)

# Kotlin and Swift both need a real compile to analyze, and a Swift compile
# only happens on a macOS runner, which bills at ten times the Linux rate
# (same reasoning as quality-ios.yml). Gating a full CodeQL build behind every
# pull request would make that the most expensive check in the repo for no
# proportionate benefit, so this runs after merge and once a week instead —
# continuous coverage without taxing every review cycle. Semgrep
# (semgrep.yml) covers Kotlin and Swift on pull requests instead, since it
# needs no build.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '!android/**.md'
      - 'ios/**'
      - '!ios/**.md'
      - '.github/actions/setup-android/action.yml'
      - '.github/workflows/codeql-native.yml'
  schedule:
    - cron: '32 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# Analysing the newest commit on main is the whole point, so a newer push
# supersedes an older run rather than queueing behind it.
#
# `false` was actively harmful here. The Swift job can occupy the group for its
# full timeout, and GitHub keeps only one *pending* run per group: when a second
# push arrives while one is already waiting, the older pending run is cancelled.
# That is not the run you want to lose. It cost the analysis of the commit that
# fixed an open alert -- the fix merged, its run was evicted by the next merge,
# and the alert stayed open pointing at code that no longer existed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  HOMEBREW_NO_ENV_HINTS: '1'

jobs:
  # Workflow-level `paths` can only start or skip the whole workflow. An
  # iOS-only push still has to run this file so Swift is analysed, and without
  # a per-job filter the Kotlin job then compiles Android from the Gradle
  # cache: kotlinc never runs, CodeQL sees no Java/Kotlin, and analyze fails
  # with "no source code seen during build".
  #
  # The weekly schedule and a manual run cover the whole tree, not a diff.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.detect.outputs.android }}
      ios: ${{ steps.detect.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: detect
        name: Detect which languages changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          mark() {
            echo "android=$1" >> "$GITHUB_OUTPUT"
            echo "ios=$2" >> "$GITHUB_OUTPUT"
            echo "android=$1 ios=$2 ($3)"
          }

          if [ "$EVENT_NAME" != "push" ]; then
            mark true true "$EVENT_NAME"
            exit 0
          fi

          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            mark true true "no previous commit"
            exit 0
          fi

          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "$BEFORE" || {
              mark true true "could not fetch $BEFORE"
              exit 0
            }
          fi

          android=false
          ios=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              .github/workflows/codeql-native.yml)
                android=true
                ios=true
                ;;
              .github/actions/setup-android/action.yml)
                android=true
                ;;
              android/*.md) ;;
              android/*)
                android=true
                ;;
              ios/*.md) ;;
              ios/*)
                ios=true
                ;;
            esac
          done < <(git diff --name-only "$BEFORE" HEAD)

          mark "$android" "$ios" "push diff"

  android:
    name: Kotlin/Java
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: ./.github/actions/setup-android
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: java-kotlin
          source-root: android
          build-mode: manual

      # CodeQL traces the compiler. Gradle's build cache restores
      # compileFullDebugKotlin as FROM-CACHE, so kotlinc never runs and
      # analyze fails with "no source code seen". Quality (Android) wants
      # that cache; this job needs a real compile.
      - name: Build (traced by CodeQL)
        working-directory: android
        run: ./gradlew assembleFullDebug --no-build-cache --rerun-tasks

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:java-kotlin

  ios:
    name: Swift
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    # Sixty rather than the thirty this started with, and the thirty was the bug.
    # CodeQL traces the compiler, which costs far more than the build itself:
    # quality-ios.yml builds and tests the same project on the same runner in
    # seven to eight minutes, while the traced build alone was still going at
    # twenty-nine. It hit the limit every time, so Swift results never uploaded
    # and the job held the concurrency group for the full half hour on the way
    # out.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: swift
          source-root: ios
          build-mode: manual

      - name: Build (traced by CodeQL)
        working-directory: ios
        run: |
          xcodebuild \
            -project VocaPhone.xcodeproj \
            -scheme VocaPhone \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${{ runner.temp }}/DerivedData" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:swift
