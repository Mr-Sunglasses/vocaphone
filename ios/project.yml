name: LocalFlow
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CURRENT_PROJECT_VERSION: 17
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: A83WCPTTT9
targets:
  LocalFlowApp:
    type: application
    platform: iOS
    sources:
      - LocalFlowApp
      - LocalFlowShared
      - LocalFlowActivityShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.localflow
        CODE_SIGN_ENTITLEMENTS: LocalFlowApp/LocalFlowApp.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LocalFlowApp/Info.plist
    dependencies:
      - target: LocalFlowKeyboard
        embed: true
      - target: LocalFlowLiveActivity
        embed: true
  LocalFlowKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - LocalFlowKeyboard
      - LocalFlowShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.localflow.keyboard
        CODE_SIGN_ENTITLEMENTS: LocalFlowKeyboard/LocalFlowKeyboard.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: LocalFlowKeyboard/LocalFlowKeyboard-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LocalFlowKeyboard/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  LocalFlowLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - LocalFlowLiveActivity
      - LocalFlowShared
      - LocalFlowActivityShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.localflow.liveactivity
        CODE_SIGN_ENTITLEMENTS: LocalFlowLiveActivity/LocalFlowLiveActivity.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LocalFlowLiveActivity/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  LocalFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LocalFlowTests
      - LocalFlowShared
      # Key geometry is worth regression tests; the controller itself needs a
      # host extension and stays out of the test target.
      - path: LocalFlowKeyboard/KeyLayout.swift
      - path: LocalFlowKeyboard/KeyView.swift
      - path: LocalFlowKeyboard/KeyGridView.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LocalFlow:
    build:
      targets:
        LocalFlowApp: all
        LocalFlowKeyboard: all
        LocalFlowLiveActivity: all
        LocalFlowTests: [test]
    test:
      targets:
        - LocalFlowTests
