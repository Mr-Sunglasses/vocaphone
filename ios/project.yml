name: VocaPhone
options:
  bundleIdPrefix: com.vocahq
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CURRENT_PROJECT_VERSION: 17
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: A83WCPTTT9
targets:
  VocaPhoneApp:
    type: application
    platform: iOS
    sources:
      - VocaPhoneApp
      - VocaPhoneShared
      - VocaPhoneActivityShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vocahq.vocaphone
        CODE_SIGN_ENTITLEMENTS: VocaPhoneApp/VocaPhoneApp.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VocaPhoneApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: VocaPhoneKeyboard
        embed: true
      - target: VocaPhoneLiveActivity
        embed: true
  VocaPhoneKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - VocaPhoneKeyboard
      - VocaPhoneShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vocahq.vocaphone.keyboard
        CODE_SIGN_ENTITLEMENTS: VocaPhoneKeyboard/VocaPhoneKeyboard.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: VocaPhoneKeyboard/VocaPhoneKeyboard-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VocaPhoneKeyboard/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  VocaPhoneLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - VocaPhoneLiveActivity
      - VocaPhoneShared
      - VocaPhoneActivityShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vocahq.vocaphone.liveactivity
        CODE_SIGN_ENTITLEMENTS: VocaPhoneLiveActivity/VocaPhoneLiveActivity.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VocaPhoneLiveActivity/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  VocaPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VocaPhoneTests
      - VocaPhoneShared
      # Key geometry is worth regression tests; the controller itself needs a
      # host extension and stays out of the test target.
      - path: VocaPhoneKeyboard/KeyLayout.swift
      - path: VocaPhoneKeyboard/KeyView.swift
      - path: VocaPhoneKeyboard/KeyGridView.swift
      # The state-to-interface mapping for the dictation bar is pure, so every
      # session state can be checked without standing up the extension.
      - path: VocaPhoneKeyboard/DictationPresentation.swift
      - path: VocaPhoneKeyboard/DictationBarStyle.swift
      - path: VocaPhoneKeyboard/DictationBarView.swift
      - path: VocaPhoneKeyboard/DictationBarComponents.swift
      # The realtime capture path is the highest-risk code in the app.
      - path: VocaPhoneApp/Audio/AudioCapturePipeline.swift
      # Guided setup decides what the app claims is done, and every signal it
      # reads can be undone from iOS Settings. The model behind it is pure.
      - path: VocaPhoneApp/App/SetupStatus.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VocaPhone:
    build:
      targets:
        VocaPhoneApp: all
        VocaPhoneKeyboard: all
        VocaPhoneLiveActivity: all
        VocaPhoneTests: [test]
    test:
      targets:
        - VocaPhoneTests
