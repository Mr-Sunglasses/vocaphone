name: VocaPhone
options:
  bundleIdPrefix: com.vocahq
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
# Signing identity lives in one gitignored file, not in edits to this one.
#
# Everything a device build has to rename — the three bundle identifiers, the
# App Group, the team, and the entitlement files that name the group — is read
# from a `LOCAL_*` setting with the shipping value as its default. `just ios
# local-signing` writes those settings into `Local.xcconfig`, which is
# gitignored and is pulled in by the tracked `Signing.xcconfig` below through
# an optional include, so a checkout without one still generates.
#
# The alternative, which this replaces, was editing the identifiers here and in
# three `.entitlements` files and remembering never to commit them. That is not
# a workflow, it is a trap: one `git add -A` put a personal App Group on main,
# where it would have shipped an app that could not open its own container.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CURRENT_PROJECT_VERSION: 26
    MARKETING_VERSION: 1.0
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # `$(VAR:default=…)` resolves to the shipping value whenever
    # Local.xcconfig is absent, so a checkout with no local signing generates
    # and builds exactly as before.
    DEVELOPMENT_TEAM: "$(LOCAL_DEVELOPMENT_TEAM:default=92962VK378)"
    VOCAPHONE_APP_BUNDLE_ID: "$(LOCAL_APP_BUNDLE_ID:default=com.vocahq.vocaphone)"
    VOCAPHONE_APP_GROUP: "$(LOCAL_APP_GROUP:default=group.com.vocahq)"
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 0.16.0
  sherpa-onnx:
    url: https://github.com/k2-fsa/sherpa-onnx.git
    exactVersion: 1.13.7
targets:
  VocaPhoneApp:
    type: application
    platform: iOS
    sources:
      - VocaPhoneApp
      - VocaPhoneShared
      - VocaPhoneActivityShared
      # The keyboard's own views, so Settings can show a live preview of the
      # thing being configured. Nobody can picture 39pt against 49pt from prose.
      # The controller stays out: it is a `UIInputViewController` and has no
      # meaning outside the extension.
      - path: VocaPhoneKeyboard/KeyLayout.swift
      - path: VocaPhoneKeyboard/KeyHitMap.swift
      - path: VocaPhoneKeyboard/KeyView.swift
      - path: VocaPhoneKeyboard/KeyGridView.swift
      # The grid traces what it does with every touch, so any target that
      # compiles the grid needs the trace in scope with it.
      - path: VocaPhoneKeyboard/TouchTrace.swift
      - path: VocaPhoneKeyboard/TouchWitness.swift
      - path: VocaPhoneKeyboard/FrameMonitor.swift
      - path: VocaPhoneKeyboard/KeyAlternatives.swift
      - path: VocaPhoneKeyboard/KeyProximity.swift
      - path: VocaPhoneKeyboard/ShortWordCorrections.swift
      # The grid draws a swipe trail and asks for haptics, so the preview needs
      # both to link.
      - path: VocaPhoneKeyboard/SwipeTrailView.swift
      - path: VocaPhoneKeyboard/KeyboardHaptics.swift
      - path: VocaPhoneKeyboard/DictationPresentation.swift
      - path: VocaPhoneKeyboard/DictationBarStyle.swift
      - path: VocaPhoneKeyboard/DictationBarView.swift
      # The dictation surface itself, so the settings preview and the keyboard
      # lab show the thing the extension actually draws.
      - path: VocaPhoneKeyboard/DictationSurfaceView.swift
      - path: VocaPhoneKeyboard/DictationBarComponents.swift
      - path: VocaPhoneKeyboard/TypingStripView.swift
      - path: VocaPhoneKeyboard/TypingCandidates.swift
      - path: VocaPhoneKeyboard/WordComposer.swift
      - path: VocaPhoneKeyboard/TypingWordList.swift
      - path: VocaPhoneKeyboard/SwipeRecognizer.swift
      # The canvas host for the keyboard's UIKit views. Whole file is
      # `#if DEBUG`; it is here because the app target compiles the strip
      # and the bar, and a preview in either file needs it in scope.
      - path: VocaPhoneKeyboard/KeyboardViewPreview.swift
      # `SpokenEmoji` runs in the transcript funnel, which the app target runs
      # for its own recordings, so the app needs the same word-to-glyph table
      # the keyboard ships. One copy in the repository, two bundles.
      - path: ../assets/keyboard
        name: SharedKeyboardData
        buildPhase: resources
    resources:
      - VocaPhoneApp/Models/local_model_pins.json
      - VocaPhoneApp/Models/sherpa_model_pins.json
      - VocaPhoneApp/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(VOCAPHONE_APP_BUNDLE_ID)"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: "$(LOCAL_APP_ENTITLEMENTS:default=VocaPhoneApp/VocaPhoneApp.entitlements)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VocaPhoneApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: VocaPhoneApp/Models/SherpaOnnx-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/VocaPhoneApp/Models"
        OTHER_LDFLAGS: "$(inherited) -lc++"
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: sherpa-onnx
        product: sherpa-onnx
      - target: VocaPhoneKeyboard
        embed: true
      - target: VocaPhoneLiveActivity
        embed: true
  VocaPhoneKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - VocaPhoneKeyboard
      - VocaPhoneShared
    # One copy in the repository, shared with the Android keyboard, which reaches
    # the same two files through `sourceSets` in android/app/build.gradle.kts.
    # Two hand-maintained word lists drift, and nothing notices until the
    # platforms start suggesting different words.
      - path: ../assets/keyboard
        name: SharedKeyboardData
        buildPhase: resources
    resources:
      - VocaPhoneKeyboard/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(VOCAPHONE_APP_BUNDLE_ID).keyboard"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: "$(LOCAL_KEYBOARD_ENTITLEMENTS:default=VocaPhoneKeyboard/VocaPhoneKeyboard.entitlements)"
        SWIFT_OBJC_BRIDGING_HEADER: VocaPhoneKeyboard/VocaPhoneKeyboard-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VocaPhoneKeyboard/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  VocaPhoneLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - VocaPhoneLiveActivity
      - VocaPhoneShared
      - VocaPhoneActivityShared
    resources:
      - VocaPhoneLiveActivity/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(VOCAPHONE_APP_BUNDLE_ID).liveactivity"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: "$(LOCAL_LIVEACTIVITY_ENTITLEMENTS:default=VocaPhoneLiveActivity/VocaPhoneLiveActivity.entitlements)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VocaPhoneLiveActivity/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  VocaPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VocaPhoneTests
      - VocaPhoneShared
      # Key geometry is worth regression tests; the controller itself needs a
      # host extension and stays out of the test target.
      - path: VocaPhoneKeyboard/KeyLayout.swift
      - path: VocaPhoneKeyboard/KeyHitMap.swift
      - path: VocaPhoneKeyboard/KeyView.swift
      - path: VocaPhoneKeyboard/KeyGridView.swift
      # The grid traces what it does with every touch, so any target that
      # compiles the grid needs the trace in scope with it.
      - path: VocaPhoneKeyboard/TouchTrace.swift
      - path: VocaPhoneKeyboard/TouchWitness.swift
      - path: VocaPhoneKeyboard/FrameMonitor.swift
      # The trail's ageing and taper is pure arithmetic over sampled points, and
      # the view around it is what the grid links against.
      - path: VocaPhoneKeyboard/SwipeTrailView.swift
      # Whether a buzz is allowed at all is a rule, not a device capability.
      - path: VocaPhoneKeyboard/KeyboardHaptics.swift
      # The accent map and its popover are pure data plus one measured view.
      - path: VocaPhoneKeyboard/KeyAlternatives.swift
      # Typing intelligence. The composer, the ranking and the autocorrect rules
      # are pure; the checker sits behind a protocol so tests never depend on
      # the user's own device dictionaries.
      - path: VocaPhoneKeyboard/WordComposer.swift
      - path: VocaPhoneKeyboard/TypingCandidates.swift
      - path: VocaPhoneKeyboard/TypingFieldPolicy.swift
      - path: VocaPhoneKeyboard/TypingWordList.swift
      # The keyboard's own spatial model: which letters neighbour which, and
      # what a neighbouring-key typo costs a correction.
      - path: VocaPhoneKeyboard/KeyProximity.swift
      # The corrections a spell checker will never make, because nothing is
      # misspelled. Small, curated, and exactly the sort of table that needs a
      # test saying which words are deliberately absent.
      - path: VocaPhoneKeyboard/ShortWordCorrections.swift
      # The correction the next Delete can take back, and the rule that decides
      # whether it still points at the text it replaced.
      - path: VocaPhoneKeyboard/TypingEngine.swift
      - path: VocaPhoneKeyboard/SpellChecking.swift
      - path: VocaPhoneKeyboard/SmartPunctuation.swift
      # The word-to-emoji table is the feature worth pinning: which names
      # offer an emoji, and which ordinary words deliberately do not.
      - path: VocaPhoneKeyboard/EmojiSuggestions.swift
      - path: VocaPhoneKeyboard/SwipeRecognizer.swift
      # Replacing a swiped word is arithmetic over the space the swipe left
      # behind, and both bugs it replaces were off by exactly that character.
      - path: VocaPhoneKeyboard/SwipeAlternates.swift
      - path: VocaPhoneKeyboard/EmojiCatalog.swift
      # The state-to-interface mapping for the dictation bar is pure, so every
      # session state can be checked without standing up the extension.
      - path: VocaPhoneKeyboard/DictationPresentation.swift
      - path: VocaPhoneKeyboard/DictationBarStyle.swift
      - path: VocaPhoneKeyboard/DictationBarView.swift
      # The dictation surface itself, so the settings preview and the keyboard
      # lab show the thing the extension actually draws.
      - path: VocaPhoneKeyboard/DictationSurfaceView.swift
      - path: VocaPhoneKeyboard/DictationBarComponents.swift
      - path: VocaPhoneKeyboard/TypingStripView.swift
      # The realtime capture path is the highest-risk code in the app.
      - path: VocaPhoneApp/Audio/AudioCapturePipeline.swift
      # Guided setup decides what the app claims is done, and every signal it
      # reads can be undone from iOS Settings. The model behind it is pure.
      - path: VocaPhoneApp/App/SetupStatus.swift
      - path: VocaPhoneApp/App/OnboardingPresentation.swift
      # Who gets asked to turn Quick Dictation back on after an older build
      # switched it off for them, and who is deliberately left alone.
      - path: VocaPhoneApp/App/QuickDictationRecoveryOffer.swift
      # The external-dictation screen stays truthful through recording,
      # processing, a ready transcript, and recoverable failures.
      - path: VocaPhoneApp/App/KeyboardHandoffPresentation.swift
      # Which transcription route is selected, whether it is ready, and what the
      # interface is allowed to claim about where audio goes.
      - path: VocaPhoneApp/App/TranscriptionSourceStatus.swift
      # The home screen's single session card, derived rather than assembled in
      # the view, so every session state can be checked without an audio stack.
      - path: VocaPhoneApp/App/HomePresentation.swift
      - path: VocaPhoneApp/App/DesignSystem.swift
      # Search, filter and day-grouping for the transcript library. The grouping
      # arithmetic is the part that goes wrong at midnight and across zones.
      - path: VocaPhoneApp/App/TranscriptHistoryModel.swift
      # Pure formatting and social composer contracts for the Stats screen.
      # The rendered card and clipboard exporter remain app-only UIKit code.
      - path: VocaPhoneApp/App/StatsPresentation.swift
      # Same reason as the app target: the strip and the bar carry their
      # own previews, and this is what those previews are built from.
      - path: VocaPhoneKeyboard/KeyboardViewPreview.swift
      # Usage reporting. These tests are the privacy claim: the promise is that
      # the code *cannot* put a transcript, a gateway address or a device model
      # on the wire, not that reviewers will notice if it does. Listed file by
      # file rather than as a directory so it stays obvious that this code is
      # in the app target and the test target, and in no extension.
      - path: VocaPhoneApp/Telemetry/TelemetryEvent.swift
      - path: VocaPhoneApp/Telemetry/TelemetryConfig.swift
      - path: VocaPhoneApp/Telemetry/TelemetryRecord.swift
      - path: VocaPhoneApp/Telemetry/TelemetryQueue.swift
      - path: VocaPhoneApp/Telemetry/TelemetrySink.swift
      - path: VocaPhoneApp/Telemetry/Telemetry.swift
      - path: VocaPhoneApp/Telemetry/UsageReportingCopy.swift
      - path: VocaPhoneApp/Telemetry/TelemetryStats.swift
      - path: VocaPhoneApp/Telemetry/TelemetryFailureMapping.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  VocaPhone:
    build:
      targets:
        VocaPhoneApp: all
        VocaPhoneKeyboard: all
        VocaPhoneLiveActivity: all
        VocaPhoneTests: [test]
    test:
      targets:
        - VocaPhoneTests
